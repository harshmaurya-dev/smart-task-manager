<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsh Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Harsh Task Manager</h1>
        <p class="subtitle">Organize your daily tasks efficiently</p>

        <div class="input-box">
            <input type="text" id="taskInput" placeholder="Enter your task...">
            <button id="addBtn">Add Task</button>
        </div>

        <div class="stats">
            <p id="totalTasks">Total Tasks: 0</p>
            <p id="completedTasks">Completed: 0</p>
        </div>

        <ul id="taskList"></ul>

        <footer>
            Created by <strong>Harsh Maurya</strong>
        </footer>

    </div>

    <script src="brain.js"></script>
</body>
</html>
